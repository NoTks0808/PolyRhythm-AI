<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolyRhythm AI - Math Rock Drum Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Neo-Tokyo Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Core Colors */
      --bg-deep: #0a0a0f;
      --bg-card: rgba(15, 15, 25, 0.85);
      --accent-primary: #00ffaa;
      --accent-secondary: #7c3aed;
      --accent-warm: #ff6b35;
      --text-primary: #e4e4e7;
      --text-muted: #71717a;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --glow-primary: rgba(0, 255, 170, 0.15);
    }

    body {
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      background-color: var(--bg-deep);
      color: var(--text-primary);
    }

    /* Display Font for Titles */
    .font-display {
      font-family: 'Orbitron', sans-serif;
    }

    /* Noise Texture Overlay */
    .noise-overlay::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      z-index: 9999;
    }

    /* Music Grid Background */
    .grid-bg {
      background-image:
        linear-gradient(to right, rgba(0, 255, 170, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 170, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Glow Effects */
    .glow-border {
      box-shadow:
        0 0 0 1px var(--border-subtle),
        0 0 30px rgba(0, 255, 170, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .glow-text {
      text-shadow: 0 0 20px var(--glow-primary);
    }

    /* Breathing Animation */
    @keyframes breathe {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    .animate-breathe {
      animation: breathe 2s ease-in-out infinite;
    }

    /* Wave Animation for Audio */
    @keyframes wave {

      0%,
      100% {
        transform: scaleY(0.3);
      }

      50% {
        transform: scaleY(1);
      }
    }

    .wave-bar {
      animation: wave 1.2s ease-in-out infinite;
    }

    /* Scan Line Effect */
    @keyframes scan {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(100vh);
      }
    }

    .scan-line::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
      opacity: 0.1;
      animation: scan 8s linear infinite;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 170, 0.2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 255, 170, 0.4);
    }

    /* Button Hover Lift */
    .hover-lift {
      transition: all 0.2s ease;
    }

    .hover-lift:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0, 255, 170, 0.15);
    }

    /* Focus Ring */
    .focus-ring:focus {
      outline: none;
      box-shadow: 0 0 0 2px var(--bg-deep), 0 0 0 4px var(--accent-primary);
    }

    /* Gradient Text */
    .gradient-text {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Accent Range Input */
    input[type="range"] {
      -webkit-appearance: none;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent-primary);
      border-radius: 50%;
      margin-top: -5px;
      box-shadow: 0 0 10px var(--glow-primary);
      cursor: pointer;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="noise-overlay">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
